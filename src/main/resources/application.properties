spring.application.name=nl-query-guard

# --- datasource (앱 계정: 스키마 관리 + 로그 기록) ---
# 아래 비밀번호는 로컬 docker compose 전용 더미다. 외부에서 통하지 않는다.
# 실제 키(LLM API 등)는 절대 여기 쓰지 말고 .env 로 뺀다 (.gitignore 처리됨).
spring.datasource.url=jdbc:mysql://localhost:3306/nlquery?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=app
spring.datasource.password=apppw
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- 질의 실행 전용 읽기 계정 (ADR-002 방어층 4) ---
app.query-datasource.url=jdbc:mysql://localhost:3306/nlquery?serverTimezone=Asia/Seoul
app.query-datasource.username=query_ro
app.query-datasource.password=ropw

# --- 안전장치 ---
app.guard.max-rows=200
app.guard.query-timeout-ms=3000
app.guard.allowed-tables=transactions,categories
app.guard.confidence-threshold=0.7
app.guard.max-regenerate=2

# --- LLM (2주차부터. 기본은 mock) ---
app.llm.mode=mock
app.llm.timeout-ms=5000
app.llm.max-retry=3

# --- actuator ---
management.endpoints.web.exposure.include=health,info,metrics
