# 8/30(일) 등록 예정 — 프롬프트 회귀 테스트
#
# 목적: 프롬프트나 모델을 바꿨을 때 의도 분류 정확도가 떨어지면 머지를 막는다.
# 게이트 질문 ④ "프롬프트를 바꿔 정확도가 떨어졌을 때, 그걸 사람이 아니라 무엇이 잡아주나?"
# 의 답이 이 파일이다.

name: prompt-regression

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'src/main/java/**/llm/**'

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      # 기준선. 이 값 아래로 떨어지면 실패한다.
      BASELINE_ACCURACY: '0.80'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: run eval on 30 cases
        run: ./gradlew test --tests '*PromptRegressionTest*' --no-daemon

      - name: comment result
        if: always()
        run: echo "정확도 결과를 PR 코멘트로 남기도록 구현 예정"
